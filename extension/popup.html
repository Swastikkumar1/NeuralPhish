<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralPhish Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #f8f9fa;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #2a3052;
      padding-bottom: 10px;
    }
    .logo {
      font-weight: 800;
      font-size: 1.15rem;
      background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #1f2937;
      color: #9ca3af;
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: #131829;
      border: 1px solid #2a3052;
      color: #b0b8c8;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #00d4ff;
      color: #0a0e27;
      font-weight: 600;
      border-color: #00d4ff;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: #131829;
      border: 1px solid #2a3052;
      border-radius: 8px;
      color: #f8f9fa;
      padding: 10px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      outline: none;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.2);
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 100%);
      border: none;
      border-radius: 8px;
      color: #0a0e27;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-bottom: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: #1a1f3a;
      color: #00d4ff;
      border: 1px solid #2a3052;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 7px;
    }
    .result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: #131829;
      border: 1px solid #2a3052;
      display: none;
    }
    .result-box.danger { border-color: #ef4444; background: rgba(239, 68, 68, 0.08); }
    .result-box.warning { border-color: #f59e0b; background: rgba(245, 158, 11, 0.08); }
    .result-box.safe { border-color: #10b981; background: rgba(16, 185, 129, 0.08); }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }
    .badge.danger { background: #ef4444; color: #fff; }
    .badge.warning { background: #f59e0b; color: #000; }
    .badge.safe { background: #10b981; color: #fff; }
    .result-summary { font-size: 0.82rem; line-height: 1.4; color: #b0b8c8; margin-top: 6px; }
    .risk-score { font-weight: 700; font-size: 0.9rem; }
    .footer-link {
      margin-top: 12px;
      text-align: center;
      font-size: 0.75rem;
    }
    .footer-link a { color: #00d4ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️ NeuralPhish</div>
    <div id="connStatus" class="status-badge">Checking...</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabMsg">💬 Messenger</button>
    <button class="tab-btn" id="tabUrl">🔗 URL Scan</button>
  </div>

  <div id="paneMsg">
    <textarea id="msgInput" rows="4" placeholder="Paste WhatsApp message, suspicious email, or chat text..."></textarea>
    <button class="btn" id="btnScanMsg">Scan Message</button>
  </div>

  <div id="paneUrl" style="display: none;">
    <input type="text" id="urlInput" placeholder="https://example-link.com">
    <button class="btn" id="btnScanUrl">Scan URL</button>
    <button class="btn btn-secondary" id="btnScanCurrentTab">Scan Current Tab</button>
  </div>

  <div id="resultBox" class="result-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="resBadge" class="badge"></span>
      <span id="resScore" class="risk-score"></span>
    </div>
    <div id="resSummary" class="result-summary"></div>
  </div>

  <div class="footer-link">
    <a href="http://127.0.0.1:5000" target="_blank">Open Full NeuralPhish Security Dashboard ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
